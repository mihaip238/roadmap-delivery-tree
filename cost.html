<!DOCTYPE html>
<html lang="en" data-page="cost">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cost — Hours Control</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="shell-header"></div>
  <main class="page">
    <h1>Cost</h1>
    <p class="lede">Unique hours vs budget. Empty budget shows a dash, not zero. BRPaaS milestones are the program cut, not the BRP as a Service product line.</p>
    <div class="toolbar">
      <button type="button" class="primary" id="save">Save budgets</button>
      <button type="button" class="ghost" id="download">Download JSON</button>
      <span class="status" id="status"></span>
    </div>
    <h2 class="section">Product lines</h2>
    <div class="table-wrap" id="products"></div>
    <h2 class="section">BRPaaS program milestones</h2>
    <div class="table-wrap" id="milestones"></div>
    <h2 class="section">EDPs</h2>
    <div class="toolbar">
      <label class="chk"><input type="checkbox" id="activeOnly" checked /> Active only</label>
      <input type="search" id="q" placeholder="Filter EDPs" />
    </div>
    <div class="table-wrap" id="edps"></div>
  </main>
  <div id="shell-footer"></div>
  <script src="jira_map/tree_data.js"></script>
  <script src="assets/js/hours.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/save.js"></script>
  <script src="assets/js/cost.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-page="cost">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cost — Hours Control</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="shell-header"></div>
  <main class="page">
    <header class="work-bar in-page">
      <div class="toolbar">
        <span class="status" id="status"></span>
        <div class="toolbar-end">
          <button type="button" class="ghost" id="download">Download</button>
          <button type="button" class="primary" id="save">Save</button>
        </div>
      </div>
    </header>
    <div class="panel-k">Product line</div>
    <div class="table-wrap" id="products"></div>
    <div class="panel-k">M1–M4</div>
    <div class="table-wrap" id="milestones"></div>
    <div class="panel-k">EDP</div>
    <div class="toolbar">
      <label class="chk"><input type="checkbox" id="activeOnly" checked /> Active</label>
      <div class="toolbar-end">
        <input type="search" id="q" placeholder="Search" />
      </div>
    </div>
    <div class="table-wrap" id="edps"></div>
  </main>
  <div id="shell-footer"></div>
  <script src="jira_map/tree_data.js"></script>
  <script src="assets/js/hours.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/save.js"></script>
  <script src="assets/js/cost.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-page="reports">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deliverable — Hours Control</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="shell-header"></div>
  <main class="page deliverable-page">
    <header class="deliverable-context">
      <label><span>Deliverable</span><select id="deliverable-select"></select></label>
      <span class="status mono" id="deliverable-snapshot"></span>
      <div class="toolbar-end">
        <a class="btn ghost" id="deliverable-jira" target="_blank" rel="noreferrer">Jira</a>
        <a class="btn" id="deliverable-tree">Tree</a>
      </div>
    </header>

    <section class="deliverable-title" id="deliverable-title"></section>
    <section class="report-kpis deliverable-kpis" id="deliverable-kpis"></section>
    <section class="evidence-line" id="deliverable-evidence"></section>

    <section class="report-analysis-grid">
      <article class="report-panel"><div class="chart" id="deliverable-workflow"></div></article>
      <article class="report-panel"><div class="chart" id="deliverable-hours"></div></article>
    </section>

    <section class="deliverable-control-grid">
      <article class="report-panel">
        <div class="report-detail-head"><h2>Control signals</h2></div>
        <div id="deliverable-signals"></div>
      </article>
      <article class="report-panel">
        <div class="report-detail-head"><h2>Track next in Jira</h2></div>
        <div id="deliverable-gaps"></div>
      </article>
    </section>

    <section class="report-panel report-detail">
      <div class="report-detail-head">
        <h2>Jira scope</h2>
        <span class="mono muted" id="deliverable-count"></span>
      </div>
      <div class="table-wrap" id="deliverable-table"></div>
    </section>
  </main>
  <div id="shell-footer"></div>
  <script src="jira_map/tree_data.js"></script>
  <script src="jira_map/report_history.js"></script>
  <script src="assets/js/hours.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/reporting.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/kpis.js"></script>
  <script src="assets/js/deliverable.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-page="delivery">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delivery — Hours Control</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="shell-header"></div>
  <main class="workspace">
    <header class="work-bar">
      <div class="work-title">Delivery</div>
      <div class="toolbar">
        <select id="view-toggle">
          <option value="product">Product</option>
          <option value="milestone">M1–M4</option>
        </select>
        <input type="search" id="tree-search" placeholder="Search" />
        <select id="status-filter">
          <option value="">Health</option>
          <option value="confirmed">Confirmed</option>
          <option value="pending">Pending</option>
          <option value="none">None</option>
        </select>
        <label class="chk"><input type="checkbox" id="active-only" checked /> Active</label>
      </div>
    </header>
    <div class="work-split">
      <aside class="navigator">
        <div class="line-switch" id="line-switch"></div>
        <div class="nav-edps">
          <div class="nav-meta" id="nav-meta"></div>
          <div class="nav-list" id="nav-list"></div>
        </div>
      </aside>
      <section class="record" id="record-pane"></section>
    </div>
  </main>
  <div id="shell-footer"></div>
  <script src="jira_map/tree_data.js"></script>
  <script src="assets/js/hours.js"></script>
  <script src="assets/js/record.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/delivery.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E21 delivery views</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,640&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --paper: #f3ecdf; --ink: #1c2430; --soft: #4a5564; --navy: #243044; --chip: #fffaf3; --rule: #cbbba3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Source Sans 3", sans-serif;
      background: var(--paper); color: var(--ink);
      background-image: radial-gradient(circle at 1px 1px, rgba(28,36,48,0.05) 1px, transparent 0);
      background-size: 22px 22px;
      display: grid; place-items: center; padding: 32px 20px;
    }
    main { max-width: 640px; }
    h1 { font-family: Fraunces, serif; font-size: 36px; margin: 0 0 8px; letter-spacing: -0.03em; }
    p { color: var(--soft); line-height: 1.5; margin: 0 0 22px; }
    .cards { display: grid; gap: 12px; }
    a.card {
      display: block; background: var(--chip); color: inherit; text-decoration: none;
      border: 1px solid var(--navy); padding: 18px 20px;
    }
    a.card:hover { background: var(--navy); color: var(--paper); }
    a.card strong { font-family: Fraunces, serif; font-size: 22px; display: block; margin-bottom: 4px; }
    a.card span { font-size: 14px; opacity: 0.85; }
  </style>
</head>
<body>
  <main>
    <h1>E21 delivery views</h1>
    <p>Same Jira-backed tree in two layouts. Product Name comes from Jira. PolarIS links are ground truth; inferred matches are title-based.</p>
    <div class="cards">
      <a class="card" href="E21_Delivery_Tree.html">
        <strong>List tree</strong>
        <span>Product → EDP → EPP → Feature → Story. Search, filter, expand.</span>
      </a>
      <a class="card" href="E21_Map.html">
        <strong>Coggle map</strong>
        <span>Radial map of the same tree. Click a branch, drag, zoom.</span>
      </a>
    </div>
  </main>
</body>
</html>

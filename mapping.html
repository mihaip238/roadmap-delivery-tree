<!DOCTYPE html>
<html lang="en" data-page="mapping">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapping — Hours Control</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="shell-header"></div>
  <main class="page">
    <h1>Mapping</h1>
    <p class="lede">Confirm, reject, or add EPPs for an EDP. Saving writes overlay JSON only — Jira is not updated. Use <span class="key">python serve.py</span> to save locally.</p>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Filter EDPs" />
      <button type="button" class="primary" id="save">Save overlay</button>
      <button type="button" class="ghost" id="download">Download JSON</button>
      <span class="status" id="status"></span>
    </div>
    <div class="split">
      <div>
        <h2 class="section">Inbox</h2>
        <p class="note">Active EDPs with no cost members, or with pending inferred EPPs. Confirm BRP as a Service and Power Balancer first.</p>
        <div id="inbox"></div>
        <h2 class="section">All active</h2>
        <div id="all"></div>
      </div>
      <aside class="panel" id="inspector">
        <p class="muted">Select an EDP.</p>
      </aside>
    </div>
  </main>
  <div id="shell-footer"></div>
  <script src="jira_map/tree_data.js"></script>
  <script src="assets/js/hours.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/save.js"></script>
  <script src="assets/js/mapping.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-page="mapping">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapping — Hours Control</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="shell-header"></div>
  <main class="workspace">
    <header class="work-bar">
      <div class="work-title">Mapping</div>
      <div class="toolbar">
        <input type="search" id="map-search" placeholder="Search" />
        <select id="map-status">
          <option value="inbox">Inbox</option>
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="none">None</option>
        </select>
        <div class="toolbar-end">
          <span class="status" id="status"></span>
          <button type="button" class="ghost" id="download">Download</button>
          <button type="button" class="primary" id="save">Save</button>
        </div>
      </div>
    </header>
    <div class="work-split">
      <aside class="navigator">
        <div class="nav-context" id="line-switch"></div>
        <div class="nav-edps">
          <div class="nav-list" id="nav-list"></div>
        </div>
      </aside>
      <section class="record" id="record-pane"></section>
    </div>
  </main>
  <div id="shell-footer"></div>
  <script src="jira_map/tree_data.js"></script>
  <script src="assets/js/hours.js"></script>
  <script src="assets/js/record.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/save.js"></script>
  <script src="assets/js/mapping.js"></script>
</body>
</html>

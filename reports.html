<!DOCTYPE html>
<html lang="en" data-page="reports">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reports — Hours Control</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="shell-header"></div>
  <main class="page report-page">
    <header class="report-context" aria-label="Report context">
      <div class="report-context-main">
        <label><span>View</span><select id="report-mode">
          <option value="product">Product line</option>
          <option value="program">Program M1–M4</option>
        </select></label>
        <label><span>Metric</span><select id="report-metric">
          <option value="cost">Cost</option>
          <option value="logged">Logged</option>
          <option value="budget">Budget</option>
          <option value="remaining">Left</option>
          <option value="pending">Pending</option>
          <option value="mapping">Mapping</option>
        </select></label>
        <label><span>Compare</span><select id="report-compare">
          <option value="none">None</option>
          <option value="logged">Logged</option>
          <option value="budget">Budget</option>
        </select></label>
        <label><span>Range</span><select id="report-range">
          <option value="30">30d</option>
          <option value="90">90d</option>
          <option value="all">All</option>
        </select></label>
        <span class="status mono" id="report-snapshot"></span>
        <div class="toolbar-end">
          <button type="button" class="ghost" id="report-reset">Reset</button>
          <button type="button" id="report-export">CSV</button>
        </div>
      </div>
      <div class="report-filters">
        <button type="button" class="report-drill-back" id="report-drill-back" hidden>←</button>
        <span class="report-drill-label" id="report-drill-label"></span>
        <label class="chk" id="report-active-wrap"><input type="checkbox" id="report-active" checked /> Active</label>
        <label id="report-product-wrap"><span>Product</span><select id="report-product"><option value="all">All</option></select></label>
        <label id="report-milestone-wrap" hidden><span>Milestone</span><select id="report-milestone"><option value="">All</option></select></label>
        <label id="report-health-wrap"><span>Health</span><select id="report-health">
          <option value="">All</option>
          <option value="confirmed">Confirmed</option>
          <option value="pending">Pending</option>
          <option value="none">None</option>
        </select></label>
        <input type="search" id="report-search" placeholder="Search" />
        <label><span>Rows</span><select id="report-top">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="all">All</option>
        </select></label>
      </div>
    </header>

    <section class="report-kpis" id="report-summary"></section>

    <section class="report-analysis-grid">
      <article class="report-panel report-primary">
        <div class="chart" id="primary-chart"></div>
      </article>
      <article class="report-panel report-composition">
        <div class="chart" id="composition-chart"></div>
      </article>
    </section>

    <section class="report-panel report-trend">
      <div class="chart" id="trend-chart"></div>
      <div class="history-kpis" id="trend-summary"></div>
    </section>

    <section class="report-secondary-grid">
      <article class="report-panel">
        <div class="chart" id="concentration-chart"></div>
      </article>
      <article class="report-panel" id="shared">
        <div class="chart" id="shared-chart"></div>
      </article>
    </section>

    <section class="report-panel report-detail" id="detail-panel">
      <div class="report-detail-head">
        <h2 id="detail-title"></h2>
        <span class="mono muted" id="detail-count"></span>
      </div>
      <div class="table-wrap" id="report-table"></div>
    </section>
  </main>
  <div id="shell-footer"></div>
  <script src="jira_map/tree_data.js"></script>
  <script src="jira_map/report_history.js"></script>
  <script src="assets/js/hours.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/reporting.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/reports.js"></script>
</body>
</html>

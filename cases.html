<!DOCTYPE html>
<html lang="en" data-page="cases">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cases — Hours Control</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="shell-header"></div>
  <main class="workspace">
    <header class="work-bar">
      <div class="work-title">Cases</div>
      <div class="toolbar">
        <input type="search" id="case-search" placeholder="Search" />
        <label class="chk"><input type="checkbox" id="case-active" checked /> Active</label>
        <div class="toolbar-end">
          <span class="status" id="case-status"></span>
          <button type="button" class="ghost" id="case-new">New case</button>
          <button type="button" class="ghost" id="case-download">Download</button>
          <button type="button" class="primary" id="case-save">Save</button>
        </div>
      </div>
    </header>
    <div class="work-split">
      <aside class="navigator">
        <div class="nav-context case-nav-context">
          <span>Business cases</span>
          <b class="mono" id="case-count"></b>
        </div>
        <div class="nav-edps">
          <div class="nav-list" id="case-list"></div>
        </div>
      </aside>
      <section class="record case-record" id="case-record"></section>
    </div>
  </main>
  <div id="shell-footer"></div>
  <script src="jira_map/tree_data.js"></script>
  <script src="assets/js/hours.js"></script>
  <script src="assets/js/record.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/save.js"></script>
  <script src="assets/js/cases.js"></script>
</body>
</html>
